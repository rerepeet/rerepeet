name: Build desktop downloads

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac-arm:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run package:mac:arm64
      - uses: actions/upload-artifact@v4
        with: { name: macOS-arm64, path: release/*.dmg, if-no-files-found: error }

  mac-intel:
    name: macOS Intel
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run package:mac:x64
      - uses: actions/upload-artifact@v4
        with: { name: macOS-x64, path: release/*.dmg, if-no-files-found: error }

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with: { name: Windows-x64, path: release/*.exe, if-no-files-found: error }

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run package:linux
      - uses: actions/upload-artifact@v4
        with: { name: Linux-x64, path: release/*.AppImage, if-no-files-found: error }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # The Apple-silicon package is the primary macOS download. Keep the
    # Intel build independent so a saturated macOS-13 queue cannot delay a
    # Windows/Linux release.
    needs: [mac-arm, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
